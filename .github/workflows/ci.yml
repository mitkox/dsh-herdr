name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unit checks (syntax + fixture smoke tests)
        run: bash tests/run.sh

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh app/install.sh plugin/install.sh \
            monitor/tests/*.sh tests/*.sh

      - name: Verify the packaged file list
        run: npm pack --dry-run
